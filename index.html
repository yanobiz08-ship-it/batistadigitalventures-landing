<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Batista Digital Ventures</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f17;
      color: #f8fafc;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 640px;
      background: #131a29;
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 16px;
      padding: 40px 28px;
    }
    h1 {
      margin: 0 0 12px;
      color: #d4af37;
      font-size: 2rem;
    }
    p {
      margin: 0 0 24px;
      line-height: 1.6;
      color: #cbd5e1;
    }
    .tag {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(212, 175, 55, 0.15);
      color: #f8fafc;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Batista Digital Ventures</h1>
    <p>Estudio y desarrollo de plataformas digitales, aplicaciones móviles y soluciones tecnológicas.</p>
    <span class="tag">Próximamente · En línea</span>
  </div>
</body>
</html>
